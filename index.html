<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Days Together</title>
<link rel="stylesheet" href="css/style.css?v=7">
</head>
<body>

  <canvas id="bgScenery" aria-hidden="true"></canvas>
  <canvas id="fgInteractive" aria-hidden="true"></canvas>

  <div class="scene-toggle" id="sceneToggle">
    <button class="scene-toggle-handle" id="sceneToggleHandle" aria-haspopup="true" aria-label="Preview other occasions"></button>
    <div class="scene-panel" id="scenePanel"></div>
  </div>

  <aside class="love-panel" aria-label="Tessa's letter and reasons, for Uncertainty">
    <h2 class="love-panel-title">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21S2.4 15.6 2.4 8.8C2.4 5.4 5 3 8.1 3c1.9 0 3.5 1 4.4 2.5A5.2 5.2 0 0 1 16.9 3c3.1 0 5.6 2.4 5.6 5.8 0 6.8-9.6 12.2-9.6 12.2z" fill="currentColor"/></svg>
      <span>Why I Love You My Beloved Uncertainty</span>
      <button class="envelope-btn" type="button" data-person="tessa" aria-label="Open Tessa's love letter" aria-haspopup="dialog">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="6" width="18" height="13" rx="2.2" fill="none" stroke="currentColor" stroke-width="1.4"/>
          <path d="M4 7.2l8 6.3 8-6.3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M12 12.8c-1 .9-1 2.5 0 3.3 1-.8 1-2.4 0-3.3z" fill="currentColor"/>
        </svg>
      </button>
    </h2>
    <!-- The reasons below are filled in by script.js from js/letters-content.js (window.LettersContent.tessa.reasons) — edit the words there, not here. -->
    <ul class="love-list" id="loveListTessa"></ul>
  </aside>

  <div class="card">

    <!-- hidden defs: gradients + one wing shape, reused (mirrored) on both sides -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <defs>
        <linearGradient id="featherGold" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#EFD3A0"/>
          <stop offset="100%" stop-color="var(--gold)"/>
        </linearGradient>
        <linearGradient id="featherRose" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#E6A9B2"/>
          <stop offset="100%" stop-color="var(--rose)"/>
        </linearGradient>
        <linearGradient id="heartFill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#E38792"/>
          <stop offset="55%" stop-color="var(--rose)"/>
          <stop offset="100%" stop-color="var(--wine)"/>
        </linearGradient>
        <radialGradient id="impactFlashGrad" cx="50%" cy="42%" r="65%">
          <stop offset="0%" stop-color="#FFFBF2"/>
          <stop offset="40%" stop-color="var(--gold)"/>
          <stop offset="75%" stop-color="var(--rose)"/>
          <stop offset="100%" stop-color="var(--rose)" stop-opacity="0"/>
        </radialGradient>
        <g id="wingShape">
          <path class="feather f5" d="M76,55 C50,10 25,6 22,10 C22,25 50,42 76,55 Z"/>
          <path class="feather f4" d="M83,66 C45,5 15,2 12,10 C15,28 55,52 83,66 Z"/>
          <path class="feather f3" d="M87,76 C55,25 25,22 15,32 C28,50 65,68 87,76 Z"/>
          <path class="feather f2" d="M90,84 C65,50 35,48 22,55 C40,72 75,80 90,84 Z"/>
          <path class="feather f1" d="M92,90 C70,70 45,72 38,82 C55,95 80,96 92,90 Z"/>
        </g>
      </defs>
    </svg>

    <div class="heart-stage" id="heartStage">
      <div class="heart-drag" id="heartDrag">
        <span class="wing-wrap wing-left" aria-hidden="true">
          <svg class="wing" viewBox="0 0 100 100"><use href="#wingShape"></use></svg>
        </span>

        <button class="heart-btn" id="heartBtn" aria-label="Send some love">
          <span class="heart-shine-wrap">
            <svg class="heart-glyph" id="heartGlyph" viewBox="0 0 32 29" aria-hidden="true">
              <path d="M16 28 C16 28 1 18.5 1 9.5 C1 4 5 1 9.5 1 C12.7 1 15 3 16 5.5 C17 3 19.3 1 22.5 1 C27 1 31 4 31 9.5 C31 18.5 16 28 16 28 Z" fill="url(#heartFill)"/>
              <path d="M9,6.2 C6.6,7.2 5.1,9.4 5.1,12" stroke="rgba(255,255,255,.65)" stroke-width="1.6" stroke-linecap="round" fill="none"/>
            </svg>
          </span>
        </button>

        <span class="wing-wrap wing-right" aria-hidden="true">
          <svg class="wing" viewBox="0 0 100 100"><use href="#wingShape"></use></svg>
        </span>
      </div>
    </div>

    <div class="occasion-banner" id="occasionBanner" aria-live="polite"></div>

    <p class="eyebrow">together for</p>
    <div class="count" id="dayCount">0</div>
    <div class="label">days, and counting</div>
    <div class="divider"></div>
    <p class="breakdown" id="breakdown"></p>
    <p class="since" id="sinceLine"></p>
  </div>

  <aside class="love-panel" aria-label="Uncertainty's letter and reasons, for Tessa">
    <h2 class="love-panel-title">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21S2.4 15.6 2.4 8.8C2.4 5.4 5 3 8.1 3c1.9 0 3.5 1 4.4 2.5A5.2 5.2 0 0 1 16.9 3c3.1 0 5.6 2.4 5.6 5.8 0 6.8-9.6 12.2-9.6 12.2z" fill="currentColor"/></svg>
      <span>Why I Love You My Beloved Tessa</span>
      <button class="envelope-btn" type="button" data-person="uncertainty" aria-label="Open Uncertainty's love letter" aria-haspopup="dialog">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="6" width="18" height="13" rx="2.2" fill="none" stroke="currentColor" stroke-width="1.4"/>
          <path d="M4 7.2l8 6.3 8-6.3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M12 12.8c-1 .9-1 2.5 0 3.3 1-.8 1-2.4 0-3.3z" fill="currentColor"/>
        </svg>
      </button>
    </h2>
    <!-- The reasons below are filled in by script.js from js/letters-content.js (window.LettersContent.uncertainty.reasons) — edit the words there, not here. -->
    <ul class="love-list" id="loveListUncertainty"></ul>
  </aside>

  <div class="float-heart-layer" id="floatLayer" aria-hidden="true"></div>

  <!-- The love letters themselves also come from js/letters-content.js (letterTitle / letterParagraphs), built into the peek below when an envelope button is clicked. Edit the words there, not here. -->

  <div class="letter-modal" id="letterModal" aria-hidden="true">
    <div class="letter-backdrop" id="letterBackdrop"></div>
    <div class="letter-peek" role="dialog" aria-modal="true" aria-labelledby="letterModalTitle">
      <button class="letter-close" id="letterClose" aria-label="Close letter" type="button">&times;</button>
      <h3 class="letter-title" id="letterModalTitle"></h3>
      <div class="letter-body" id="letterModalBody"></div>
    </div>
  </div>

  <script src="js/icons.js?v=7"></script>
  <script src="js/scenery.js?v=7"></script>
  <script src="js/interactive-objects.js?v=7"></script>
  <script src="js/letters-content.js?v=7"></script>
  <script src="js/script.js?v=7"></script>
</body>
</html>
